<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>管理后台 — LectureLite</title><link rel="stylesheet" href="tools/ui-refine.css?v=20260909a">
<style>
:root{--bg:#fafaf8;--surface:#fff;--surface2:#f4f4f1;--line:#e7e7e3;--line2:#d4d4cf;--fg:#1a1a1a;--dim:#6b6b67;--rec:#b54038;--shadow:0 12px 40px rgba(30,30,24,.08)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}header{height:64px;display:flex;align-items:center;gap:15px;padding:0 max(24px,calc((100vw - 1240px)/2));background:rgba(255,255,255,.9);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;backdrop-filter:blur(12px)}.wordmark{height:27px}.admin-mark{font-size:11px;color:var(--dim);border-left:1px solid var(--line);padding-left:14px;letter-spacing:.08em}.spacer{flex:1}.who{color:var(--dim);font-size:12px}.btn,button,select,input{font:inherit}.btn,button{border:1px solid var(--line2);border-radius:8px;background:#fff;color:var(--fg);padding:7px 12px;cursor:pointer;text-decoration:none}.btn:hover,button:hover{background:var(--surface2)}button.danger{color:#a33b34;border-color:#e4cbc8}main{max-width:1240px;margin:auto;padding:30px 24px 80px}.hero{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:22px}.hero h1{font-size:28px;line-height:1.2;margin:0 0 7px;letter-spacing:-.035em}.hero p{margin:0;color:var(--dim)}nav{display:flex;gap:26px;border-bottom:1px solid var(--line);margin-bottom:24px}nav button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:11px 1px;color:var(--dim)}nav button.on{color:var(--fg);border-bottom-color:var(--rec);font-weight:650}.view{display:none}.view.on{display:block}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{background:#fff;border:1px solid var(--line);border-radius:12px;padding:17px}.metric b{display:block;font-size:25px;font-weight:580;letter-spacing:-.035em}.metric span{color:var(--dim);font-size:12px}.group-title{display:flex;align-items:center;justify-content:space-between;margin:28px 0 11px}.group-title h2{font-size:15px;margin:0}.periods{display:flex;gap:5px}.periods button{padding:4px 9px;font-size:11px}.periods button.on{background:var(--fg);color:#fff;border-color:var(--fg)}.trend{height:210px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:17px;display:flex;align-items:end;gap:4px;overflow:hidden}.trend-col{flex:1;min-width:3px;display:flex;align-items:end;gap:1px;height:160px}.trend-col i{display:block;flex:1;min-width:1px;border-radius:3px 3px 0 0}.trend-col i:nth-child(1){background:#b54038}.trend-col i:nth-child(2){background:#30302d}.trend-col i:nth-child(3){background:#8b9b89}.legend{display:flex;gap:16px;color:var(--dim);font-size:11px;margin-top:8px}.legend i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:5px}.toolbar{display:flex;gap:9px;margin-bottom:12px}.toolbar input{width:min(360px,60vw);padding:8px 11px;border:1px solid var(--line2);border-radius:8px;background:#fff}.toolbar select{padding:8px;border:1px solid var(--line2);border-radius:8px;background:#fff}.table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px}table{border-collapse:collapse;width:100%;min-width:780px}th,td{text-align:left;padding:11px 13px;border-bottom:1px solid var(--line);font-size:12px}th{color:var(--dim);font-weight:550;background:#fafaf8;white-space:nowrap}tr:last-child td{border-bottom:0}tbody tr:hover{background:#fdfdfb}.uid{font-weight:650}.state{display:inline-flex;border:1px solid var(--line);border-radius:99px;padding:1px 7px;font-size:10px;color:var(--dim)}.state.bad{color:#9e3832;background:#fbefed;border-color:#ebd0cd}.state.ok{color:#39704a;background:#eff6f0;border-color:#d5e5d9}.pager{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:12px;color:var(--dim);font-size:12px}.empty{text-align:center;color:var(--dim);padding:42px}.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(20,20,18,.36);backdrop-filter:blur(5px)}.modal.show{display:flex}.dialog{width:min(720px,96vw);max-height:88vh;overflow:auto;background:#fff;border-radius:15px;box-shadow:var(--shadow)}.dialog-head{display:flex;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}.dialog-head strong{flex:1}.dialog-body{padding:18px}.detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.detail-grid div{background:var(--surface2);padding:10px;border-radius:8px}.detail-grid small{display:block;color:var(--dim)}.course-row{padding:9px 0;border-bottom:1px solid var(--line)}.temp{font:600 17px ui-monospace,Consolas,monospace;background:#f4f1e9;border:1px dashed #b9aa89;border-radius:8px;padding:12px;word-break:break-all}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(12px);opacity:0;background:#242421;color:#fff;border-radius:9px;padding:9px 14px;transition:.2s;z-index:150}.toast.show{opacity:1;transform:translateX(-50%)}@media(max-width:800px){.metrics{grid-template-columns:repeat(2,1fr)}.detail-grid{grid-template-columns:1fr 1fr}.admin-mark{display:none}main{padding:22px 14px}.hero{align-items:start;flex-direction:column}}
</style></head><body>
<header><a href="/home.html"><img class="wordmark" src="docs/logo.png?v=20260906" alt="LectureLite"></a><span class="admin-mark">管理后台</span><span class="spacer"></span><span id="who" class="who"></span><a class="btn" href="/home.html">返回主页</a></header>
<main><section class="hero"><div><h1>运营与健康概览</h1><p>掌握用户、课程、分享与学习互动的整体状态。</p></div><button id="reload">刷新数据</button></section>
<nav><button data-view="overview" class="on">概览</button><button data-view="users">用户</button><button data-view="courses">课程</button><button data-view="audit">审计</button></nav>
<section id="overview" class="view on"><div id="metrics" class="metrics"></div><div class="group-title"><h2>活动趋势</h2><div class="periods"><button data-days="7">7 天</button><button data-days="30" class="on">30 天</button><button data-days="90">90 天</button></div></div><div id="trend" class="trend"></div><div class="legend"><span><i style="background:#b54038"></i>新用户</span><span><i style="background:#30302d"></i>新课程</span><span><i style="background:#8b9b89"></i>学习会话</span><span><i style="background:#c79255"></i>作答</span><span><i style="background:#7189a8"></i>提问</span></div></section>
<section id="users" class="view"><div class="toolbar"><input id="userQ" type="search" placeholder="搜索 UID"><select id="userSort"><option value="last_active_at">最近活跃</option><option value="created_at">注册时间</option><option value="courses">课程数量</option><option value="storage_bytes">存储占用</option><option value="uid">UID</option></select></div><div class="table-wrap"><table><thead><tr><th>用户</th><th>状态</th><th>注册</th><th>最近活跃</th><th>课程</th><th>收藏</th><th>存储</th><th></th></tr></thead><tbody id="usersBody"></tbody></table></div><div id="usersPager" class="pager"></div></section>
<section id="courses" class="view"><div class="toolbar"><input id="courseQ" type="search" placeholder="搜索课程或作者"><select id="courseSort"><option value="updated">最近更新</option><option value="created">创建时间</option><option value="learners">学习人数</option><option value="size">文件大小</option><option value="title">课程名称</option></select></div><div class="table-wrap"><table><thead><tr><th>课程</th><th>作者</th><th>状态</th><th>学习者</th><th>作答 / 提问</th><th>分享</th><th>大小</th><th>更新</th></tr></thead><tbody id="coursesBody"></tbody></table></div><div id="coursesPager" class="pager"></div></section>
<section id="audit" class="view"><div class="table-wrap"><table><thead><tr><th>时间</th><th>管理员</th><th>动作</th><th>对象</th><th>结果</th><th>说明</th></tr></thead><tbody id="auditBody"></tbody></table></div><div id="auditPager" class="pager"></div></section></main>
<div id="modal" class="modal" role="dialog" aria-modal="true"><div class="dialog"><div class="dialog-head"><strong id="modalTitle">用户详情</strong><button id="modalClose">关闭</button></div><div id="modalBody" class="dialog-body"></div></div></div><div id="toast" class="toast"></div>
<script>
const $=id=>document.getElementById(id),state={overview:null,days:30,users:{page:1},courses:{page:1},audit:{page:1}};let timer;
async function api(url,opts){const r=await fetch(url,opts),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'HTTP '+r.status);return d}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmt(t){return t?new Date(t*1000).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'未知'}function bytes(n){n=Number(n)||0;return n<1048576?Math.round(n/1024)+' KB':(n/1048576).toFixed(1)+' MB'}function toast(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(timer);timer=setTimeout(()=>$('toast').classList.remove('show'),2600)}
function metric(label,value){return `<div class="metric"><b>${esc(value)}</b><span>${esc(label)}</span></div>`}async function overview(){const d=state.overview=await api('/api/admin/overview'),m=d.metrics;$('metrics').innerHTML=[['用户',m.users],['7 日 / 30 日活跃',m.active_7d+' / '+m.active_30d],['30 日新增',m.new_30d],['课程',m.courses],['存储',bytes(m.storage_bytes)],['有效 / 失效链接',m.active_links+' / '+m.inactive_links],['匿名学习会话',m.learners],['完成率',Math.round(m.completion_rate*100)+'%'],['作答 / 正确率',m.attempts+' / '+Math.round(m.correct_rate*100)+'%'],['提问 / 待处理',m.questions+' / '+m.pending_questions],['直接分享',m.direct_shares],['回收站',m.trash]].map(x=>metric(...x)).join('');renderTrend()}
function renderTrend(){const rows=state.overview?.trends[String(state.days)]||[],max=Math.max(1,...rows.flatMap(x=>[x.users,x.courses,x.learning,x.attempts,x.questions]));$('trend').innerHTML=rows.map(x=>`<div class="trend-col" title="${x.date} · 用户 ${x.users} · 课程 ${x.courses} · 学习 ${x.learning} · 作答 ${x.attempts} · 提问 ${x.questions}"><i style="height:${Math.max(2,x.users/max*100)}%"></i><i style="height:${Math.max(2,x.courses/max*100)}%"></i><i style="height:${Math.max(2,x.learning/max*100)}%"></i><i style="height:${Math.max(2,x.attempts/max*100)}%;background:#c79255"></i><i style="height:${Math.max(2,x.questions/max*100)}%;background:#7189a8"></i></div>`).join('')}
function pager(id,data,fn){$(id).innerHTML=`<button ${data.page<=1?'disabled':''}>上一页</button><span>${data.page} / ${data.pages} · 共 ${data.total} 条</span><button ${data.page>=data.pages?'disabled':''}>下一页</button>`;const bs=$(id).querySelectorAll('button');bs[0].onclick=()=>fn(data.page-1);bs[1].onclick=()=>fn(data.page+1)}
async function users(page=1){state.users.page=page;const d=await api(`/api/admin/users?page=${page}&q=${encodeURIComponent($('userQ').value)}&sort=${$('userSort').value}`);$('usersBody').innerHTML=d.items.map(u=>`<tr><td class="uid">${esc(u.uid)}${u.is_admin?' · 管理员':''}</td><td><span class="state ${u.disabled?'bad':'ok'}">${u.disabled?'已停用':u.password_change_required?'待改密码':'正常'}</span></td><td>${fmt(u.created_at)}</td><td>${fmt(u.last_active_at)}</td><td>${u.active_courses} / ${u.courses}</td><td>${u.favorites}</td><td>${bytes(u.storage_bytes)}</td><td><button data-user="${encodeURIComponent(u.uid)}">查看</button></td></tr>`).join('')||'<tr><td colspan="8" class="empty">没有匹配用户</td></tr>';$('usersBody').querySelectorAll('[data-user]').forEach(b=>b.onclick=()=>userDetail(decodeURIComponent(b.dataset.user)));pager('usersPager',d,users)}
async function courses(page=1){state.courses.page=page;const d=await api(`/api/admin/courses?page=${page}&q=${encodeURIComponent($('courseQ').value)}&sort=${$('courseSort').value}`);$('coursesBody').innerHTML=d.items.map(c=>`<tr><td class="uid">${esc(c.title||'未命名')}</td><td>${esc(c.owner)}</td><td><span class="state ${c.deleted?'bad':'ok'}">${c.deleted?'回收站':'正常'}</span></td><td>${c.learners}</td><td>${c.attempts} / ${c.questions}</td><td>${c.direct_shares} 人 · ${c.active_links} 链接</td><td>${bytes(c.size)}</td><td>${fmt(c.updated||c.created)}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">没有匹配课程</td></tr>';pager('coursesPager',d,courses)}
async function audit(page=1){state.audit.page=page;const d=await api('/api/admin/audit?page='+page);$('auditBody').innerHTML=d.items.map(x=>`<tr><td>${fmt(x.created)}</td><td>${esc(x.actor)}</td><td>${esc(x.action)}</td><td>${esc(x.target)}</td><td><span class="state ${x.success?'ok':'bad'}">${x.success?'成功':'失败'}</span></td><td>${esc(x.detail)}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">暂无管理操作</td></tr>';pager('auditPager',d,audit)}
async function userDetail(uid){const u=await api('/api/admin/users/'+encodeURIComponent(uid));$('modalTitle').textContent='用户 · '+uid;$('modalBody').innerHTML=`<div class="detail-grid"><div><small>账号状态</small>${u.disabled?'已停用':'正常'}</div><div><small>注册时间</small>${fmt(u.created_at)}</div><div><small>最近登录</small>${fmt(u.last_login_at)}</div><div><small>课程</small>${u.active_courses} / ${u.courses}</div><div><small>收藏</small>${u.favorites}</div><div><small>存储</small>${bytes(u.storage_bytes)}</div></div><div class="group-title"><h2>课程</h2></div>${u.recordings.map(r=>`<div class="course-row"><b>${esc(r.title||'未命名')}</b><br><small>${r.deleted?'回收站 · ':''}${bytes(r.size)} · ${fmt(r.updated||r.created)}</small></div>`).join('')||'<div class="empty">暂无课程</div>'}<div class="group-title"><h2>账号操作</h2></div><button id="toggleUser" class="${u.disabled?'':'danger'}">${u.disabled?'恢复账号':'停用账号'}</button> <button id="resetPassword">生成一次性临时密码</button><div id="temporary"></div>`;$('modal').classList.add('show');$('toggleUser').onclick=async()=>{if(!confirm(`确定${u.disabled?'恢复':'停用'} ${uid}？`))return;await api('/api/admin/users/'+encodeURIComponent(uid)+'/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({disabled:!u.disabled})});toast('账号状态已更新');$('modal').classList.remove('show');users(state.users.page)};$('resetPassword').onclick=async()=>{if(!confirm('原密码会立即失效，且所有登录会话将退出。继续吗？'))return;const d=await api('/api/admin/users/'+encodeURIComponent(uid)+'/reset-password',{method:'POST'});$('temporary').innerHTML=`<p>临时密码仅显示这一次，请立即安全交给用户：</p><div class="temp">${esc(d.temporary_password)}</div>`}}
async function loadCurrent(){const me=await api('/api/me');if(!me.is_admin)throw new Error('当前账号不是管理员');$('who').textContent=me.uid;await overview()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id===b.dataset.view));if(b.dataset.view==='users')users();if(b.dataset.view==='courses')courses();if(b.dataset.view==='audit')audit()});document.querySelectorAll('[data-days]').forEach(b=>b.onclick=()=>{state.days=Number(b.dataset.days);document.querySelectorAll('[data-days]').forEach(x=>x.classList.toggle('on',x===b));renderTrend()});$('userQ').oninput=()=>users(1);$('userSort').onchange=()=>users(1);$('courseQ').oninput=()=>courses(1);$('courseSort').onchange=()=>courses(1);$('reload').onclick=async()=>{await overview();toast('数据已刷新')};$('modalClose').onclick=()=> $('modal').classList.remove('show');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('show')};document.addEventListener('keydown',e=>{if(e.key==='Escape')$('modal').classList.remove('show')});loadCurrent().catch(e=>{document.querySelector('main').innerHTML='<div class="empty">'+esc(e.message)+'<br><a class="btn" href="/home.html">返回主页</a></div>'});
</script></body></html>
